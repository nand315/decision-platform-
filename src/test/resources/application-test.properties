spring.application.name=decision-platform-test

# Fresh in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:decisiontestdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

workflow.config-dir=classpath:workflows

dependency.verification.mode=OK
dependency.verification.fail-count=0

