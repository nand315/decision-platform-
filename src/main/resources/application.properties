spring.application.name=decision-platform

# H2 File Database (data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/decisiondb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Initialize schema
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Workflow config directory (classpath:workflows or file path)
workflow.config-dir=classpath:workflows

# External dependency simulation settings
dependency.verification.mode=OK
dependency.verification.fail-count=0

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

